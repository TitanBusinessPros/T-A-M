<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Follow Along</title>
    <script>
        if (new URLSearchParams(location.search).has('game')) document.documentElement.classList.add('brand-loading');
    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Arial', sans-serif;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .follow-layout {
            display: grid;
            grid-template-columns: minmax(0, 500px) minmax(150px, 220px);
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: min(100%, 760px);
        }

        .game-main { min-width: 0; width: 100%; text-align: center; }
        .sponsor-area { min-width: 0; padding: 16px; border-radius: 16px; background: #fff; box-shadow: 0 16px 34px rgba(0, 0, 0, .35); text-align: center; }
        html.brand-loading .sponsor-area { visibility: hidden; }
        .sponsor-label { margin-bottom: 12px; color: #252525; font-size: 18px; font-weight: 700; }
        .sponsor-logo-box { display: grid; place-items: center; min-height: 150px; padding: 10px; border: 1px solid #ddd; border-radius: 12px; background: #fff; color: #555; overflow-wrap: anywhere; }
        .sponsor-logo-box img { display: block; max-width: 100%; max-height: 140px; object-fit: contain; }
        .sponsor-website { display: block; margin-top: 14px; color: #174a98; font-size: 15px; font-weight: 700; text-decoration: underline; overflow-wrap: anywhere; }
        .sponsor-website[aria-disabled="true"] { color: #666; pointer-events: none; text-decoration: none; }

        @media (max-width: 600px) {
            .follow-layout { grid-template-columns: minmax(0, 1fr) minmax(104px, 28%); gap: 8px; }
            .sponsor-area { padding: 8px; }
            .sponsor-label { font-size: 13px; margin-bottom: 8px; }
            .sponsor-logo-box { min-height: 94px; padding: 5px; }
            .sponsor-logo-box img { max-height: 86px; }
            .sponsor-website { font-size: 12px; }
            #game-container { gap: 6px; }
            .button { border-width: 2px; border-radius: 12px; }
            #start-btn { width: 100%; padding: 12px 4px; font-size: 1em; }
            h1 { font-size: clamp(1.25em, 5vw, 2em); }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            text-align: center;
        }

        #score {
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        #message {
            font-size: 1.2em;
            margin-bottom: 15px;
            min-height: 30px;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }

        #game-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/2;
        }

        .button {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 100%;
            height: 100%;
        }

        .button:active {
            transform: scale(0.95);
        }

        .button.glow {
            box-shadow: 0 0 60px currentColor, 0 0 120px currentColor, 0 0 180px currentColor;
            transform: scale(1.1);
            border-color: white;
            filter: brightness(1.5);
        }

        .button.disabled {
            cursor: not-allowed;
        }

        #btn1 { background-color: #ff4444; color: #ff4444; }
        #btn2 { background-color: #44ff44; color: #44ff44; }
        #btn3 { background-color: #4444ff; color: #4444ff; }
        #btn4 { background-color: #ffff44; color: #ffff44; }
        #btn5 { background-color: #ff44ff; color: #ff44ff; }
        #btn6 { background-color: #44ffff; color: #44ffff; }

        #start-btn {
            padding: 18px 40px;
            font-size: 1.3em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s;
            width: 80%;
            max-width: 300px;
        }

        #start-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        #start-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        #music-controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        #music-toggle {
            background: none;
            border: 2px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #music-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Media Queries for different screen sizes */
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }

            #score, #message {
                font-size: 1.2em;
            }

            #game-container {
                gap: 10px;
                max-width: 400px;
            }

            #start-btn {
                padding: 16px 35px;
                font-size: 1.2em;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.8em;
            }

            #score, #message {
                font-size: 1.1em;
            }

            #game-container {
                gap: 8px;
                max-width: 320px;
            }

            #start-btn {
                padding: 14px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="follow-layout">
    <main class="game-main">
    <h1>🎮 Follow Along</h1>
    <div id="score">Score: <span id="score-value">0</span></div>
    <div id="message"></div>
    <div id="game-container">
        <div class="button" id="btn1" data-id="1"></div>
        <div class="button" id="btn2" data-id="2"></div>
        <div class="button" id="btn3" data-id="3"></div>
        <div class="button" id="btn4" data-id="4"></div>
        <div class="button" id="btn5" data-id="5"></div>
        <div class="button" id="btn6" data-id="6"></div>
    </div>
    <button id="start-btn">Start Game</button>

    <div id="music-controls">
        <button id="music-toggle">🔇 Mute Music</button>
    </div>
    </main>
    <aside class="sponsor-area" aria-label="Game sponsor">
        <div class="sponsor-label">Sponsored by</div>
        <div id="sponsorLogoBox" class="sponsor-logo-box">Your logo goes here</div>
        <a id="sponsorWebsite" class="sponsor-website" href="#" target="_top" aria-disabled="true">Your website appears here</a>
    </aside>
    </div>

    <!-- Audio element for background music -->
    <audio id="bg-music" loop>
        <source src="https://github.com/TitanBusinessPros/Follow-Along/raw/main/Follow%20Along%20Theme%20Song.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Background music control
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        let isMusicMuted = false;

        // Try to play background music when the game starts
        function startBackgroundMusic() {
            bgMusic.volume = 0.5;
            bgMusic.play().catch(error => {
                console.log("Autoplay was prevented. Please interact with the page first.");
            });
        }

        // Toggle music on/off
        musicToggle.addEventListener('click', () => {
            if (isMusicMuted) {
                bgMusic.play();
                musicToggle.textContent = "🔇 Mute Music";
            } else {
                bgMusic.pause();
                musicToggle.textContent = "🔊 Play Music";
            }
            isMusicMuted = !isMusicMuted;
        });

        const frequencies = {
            1: 261.63, // C
            2: 329.63, // E
            3: 392.00, // G
            4: 523.25, // C (high)
            5: 440.00, // A
            6: 493.88  // B
        };

        function playTone(buttonId, duration = 300) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequencies[buttonId];
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }

        function playBuzzer() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 100;
            oscillator.type = 'sawtooth';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let isPlayingSequence = false;
        let isPlayerTurn = false;

        const buttons = document.querySelectorAll('.button');
        const startBtn = document.getElementById('start-btn');
        const scoreValue = document.getElementById('score-value');
        const message = document.getElementById('message');

        function lightUpButton(buttonId, duration = 500) {
            const button = document.getElementById(`btn${buttonId}`);
            button.classList.add('glow');
            playTone(buttonId);

            return new Promise(resolve => {
                setTimeout(() => {
                    button.classList.remove('glow');
                    resolve();
                }, duration);
            });
        }

        async function playSequence() {
            isPlayingSequence = true;
            disableButtons();
            message.textContent = "Watch the pattern...";

            for (let i = 0; i < sequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 200));
                await lightUpButton(sequence[i]);
            }

            isPlayingSequence = false;
            isPlayerTurn = true;
            enableButtons();
            message.textContent = "Your turn!";
        }

        function addToSequence() {
            const randomButton = Math.floor(Math.random() * 6) + 1;
            sequence.push(randomButton);
            level++;
            scoreValue.textContent = level - 1;
        }

        function disableButtons() {
            buttons.forEach(btn => {
                btn.style.pointerEvents = 'none';
            });
        }

        function enableButtons() {
            buttons.forEach(btn => {
                btn.style.pointerEvents = 'auto';
            });
        }

        function resetGame() {
            sequence = [];
            playerSequence = [];
            level = 0;
            isPlayerTurn = false;
            scoreValue.textContent = '0';
            message.textContent = '';
            startBtn.disabled = false;
        }

        async function startGame() {
            resetGame();
            startBtn.disabled = true;
            message.textContent = "Get ready...";

            // Start background music when game starts
            startBackgroundMusic();

            await new Promise(resolve => setTimeout(resolve, 1000));
            nextRound();
        }

        async function nextRound() {
            playerSequence = [];
            addToSequence();
            await playSequence();
        }

        async function handleButtonClick(buttonId) {
            if (!isPlayerTurn || isPlayingSequence) return;

            await lightUpButton(buttonId, 300);
            playerSequence.push(buttonId);

            const currentIndex = playerSequence.length - 1;

            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                // Wrong button!
                playBuzzer();
                message.textContent = `Game Over! Final Score: ${level - 1}`;
                isPlayerTurn = false;
                disableButtons();
                startBtn.disabled = false;
                return;
            }

            if (playerSequence.length === sequence.length) {
                // Completed the sequence!
                isPlayerTurn = false;
                message.textContent = "Correct! Next round...";
                await new Promise(resolve => setTimeout(resolve, 1000));
                nextRound();
            }
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const buttonId = parseInt(button.dataset.id);
                handleButtonClick(buttonId);
            });

            // Add touch event for better mobile support
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const buttonId = parseInt(button.dataset.id);
                handleButtonClick(buttonId);
            });
        });

        startBtn.addEventListener('click', startGame);

        // Add touch event for start button
        startBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startGame();
        });

        // Initialize
        disableButtons();
    </script>
    <script type="module" src="./src/follow-along-brand.js?v=1"></script>
</body>
</html>
